<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IDOL ROAD — 新規制作版 v0.1</title>
<style>
:root{color-scheme:dark;--bg:#0d1019;--panel:#171c29;--panel2:#202638;--line:#313a4e;--text:#f6f4fc;--muted:#a6aabf;--accent:#debdff;--accent2:#9cc5ff}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#222039,var(--bg) 60%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.35}.app{max-width:720px;min-height:100dvh;margin:auto;position:relative}.screen{min-height:100dvh;padding:24px 20px 30px}.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}.brand{font-family:Georgia,'Times New Roman',serif;font-size:clamp(44px,10vw,75px);letter-spacing:.13em;line-height:1.1;text-align:center;color:#fff;margin:0}.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:11px;color:#c6b2df}.small{font-size:13px;color:var(--muted)}.muted{color:var(--muted)}.btn{border:1px solid #cdb1ef;background:linear-gradient(135deg,#e5c9ff,#c5daff);color:#161321;font-weight:800;border-radius:13px;padding:13px 20px;min-height:46px}.btn.secondary{color:var(--text);background:transparent;border-color:#67718a}.btn.ghost{background:#252a3a;border-color:#424b61;color:var(--text)}.stack{display:grid;gap:12px;width:min(100%,330px)}.card{border:1px solid var(--line);background:rgba(24,28,43,.94);padding:18px;border-radius:18px}.intro{font-size:clamp(19px,4.7vw,28px);line-height:2.05;max-width:490px;white-space:pre-line}.intro b{color:#ead2ff}.actions{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.intro-card{width:min(100%,420px);text-align:center}.portrait{width:180px;height:235px;max-width:100%;margin:0 auto 18px;border:1px dashed #7b7391;border-radius:12px;background:linear-gradient(155deg,#38314d,#1b2234);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#c9c3d6}.portrait .silhouette{font-size:65px;line-height:1}.count{font-size:12px;letter-spacing:.15em;color:var(--muted)}h2{margin:5px 0 8px;font-size:22px}p{line-height:1.7}.field{display:grid;gap:7px;text-align:left}.field label{font-weight:700;font-size:14px}.field input{width:100%;min-height:48px;background:#111724;border:1px solid #69718a;border-radius:11px;color:white;padding:12px}.note{color:#c4c7d5;font-size:13px;line-height:1.7}.error{color:#ffb4b7;font-size:13px;min-height:18px}.home{padding:0 0 100px;min-height:100dvh}.topbar{position:sticky;top:0;z-index:3;background:#101523eF;border-bottom:1px solid var(--line);padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;backdrop-filter:blur(10px)}.topbar strong{letter-spacing:.07em}.topbar span{font-size:13px;color:var(--muted)}.content{padding:20px}.content h1{font-size:22px;margin:0 0 14px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;color:var(--text);background:var(--panel);min-height:91px;font-weight:700}.tile span{display:block;font-size:24px;margin-bottom:8px}.tile:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}.wide{grid-column:1/-1}.goal{background:#231d34;border:1px solid #63537f;border-radius:15px;padding:18px;margin-top:18px}.goal h2{font-size:16px}.bottom{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#121827;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));gap:1px}.tab{background:none;color:#a8acc0;border:0;border-radius:9px;padding:7px 0;font-size:10px;min-height:50px}.tab .sym{font-size:19px;display:block;margin-bottom:4px}.tab.active{background:#332b46;color:#f0d6ff;font-weight:700}.back{margin:0 0 16px;background:transparent;border:0;color:#d9c2ff;padding:0}.placeholder{background:var(--panel);border:1px dashed #5f6378;border-radius:15px;padding:20px;color:var(--muted);line-height:1.7}.listing{display:grid;gap:9px}.member{background:var(--panel);border:1px solid var(--line);padding:13px;border-radius:12px;display:flex;justify-content:space-between;gap:9px}.danger{margin-top:25px;font-size:12px;color:#afb2c4}.danger button{color:#c9cad7;border:1px solid #53566c;background:transparent;border-radius:9px;padding:8px 12px}@media(max-width:360px){.tab{font-size:9px}.content{padding:15px}.screen{padding:20px 15px}.tile{padding:13px}}
</style>
</head>
<body><div class="app" id="app" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='idol-road-new-v001';const count=12;let save=null;let stage='title';let index=0;let currentTab='home';let homePanel='';
const root=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{let a=JSON.parse(localStorage.getItem(KEY)||'null');if(a&&a.version===1&&typeof a.groupName==='string'&&typeof a.nickname==='string')return a;}catch(e){}return null}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));return true}catch(e){return false}}
function button(text,id,cls='btn'){return `<button type="button" id="${id}" class="${cls}">${esc(text)}</button>`}
function bind(id,fn){document.getElementById(id)?.addEventListener('click',fn)}
function render(){if(stage==='title')title();else if(stage==='prologue')prologue();else if(stage==='intro')intro();else if(stage==='setup')setup();else main();}
function title(){root.innerHTML=`<main class="screen center"><div class="eyebrow">IDOL PRODUCE STORY</div><h1 class="brand">IDOL<br>ROAD</h1><p class="muted">12人の少女たちから始まる物語</p><div class="stack">${button('はじめから','new')}${button('つづきから','resume','btn secondary')}</div><p class="small" id="resumeNote">${load()?'保存データがあります':'まだ保存データはありません'}</p><p class="small">開発版 v0.1 — 初期導入部分</p></main>`;let r=document.getElementById('resume');r.disabled=!load();bind('new',()=>{if(load()&&!confirm('新しく始めると現在のセーブデータを上書きします。続けますか？'))return;stage='prologue';render()});bind('resume',()=>{save=load();if(save){stage='main';currentTab='home';homePanel='';render()}})}
function prologue(){root.innerHTML=`<main class="screen center"><div class="eyebrow">PROLOGUE</div><div class="intro">事務所を設立し、<br>オーディションやスカウトを通して集めた<br><b>12人の少女たち。</b><br><br>これから彼女たちの物語は、<br>どう進んでいくのか。</div><h2 class="brand" style="font-size:40px">IDOL ROAD</h2>${button('メンバー紹介へ','next')}</main>`;bind('next',()=>{index=0;stage='intro';render()})}
function intro(){let n=index+1;root.innerHTML=`<main class="screen center"><div class="eyebrow">MEMBER INTRODUCTION</div><div class="card intro-card"><div class="count">${String(n).padStart(2,'0')} / 12</div><div class="portrait" aria-label="応募時の写真は準備中"><div class="silhouette">♙</div><span class="small">応募時の写真（仮）</span></div><h2>メンバー ${String(n).padStart(2,'0')}</h2><p class="note">名前・生年月日・MBTI・能力などは<br>12人分の正式データ確定後に反映します。</p></div><div class="actions">${n>1?button('前のメンバー','prev','btn secondary'):''}${button(n===12?'グループ名を決める':'次のメンバー','next')}</div></main>`;bind('prev',()=>{index--;render()});bind('next',()=>{if(index===11){stage='setup'}else index++;render()})}
function setup(){root.innerHTML=`<main class="screen center"><div class="eyebrow">GROUP SETUP</div><h1 style="margin:0">グループ名を決めよう</h1><div class="card" style="width:min(100%,430px)"><form id="groupForm" class="stack" style="width:100%"><div class="field"><label for="groupName">グループ正式名称</label><input id="groupName" name="groupName" required maxlength="50" autocomplete="off" placeholder="グループ名"></div><div class="field"><label for="nickname">愛称・略称</label><input id="nickname" name="nickname" required maxlength="30" autocomplete="off" placeholder="ファンが呼ぶ愛称"></div><div class="error" id="error" role="alert"></div><button class="btn" type="submit">この名前でスタート</button></form></div><p class="note">決定した名前はセーブデータに保存されます。</p></main>`;document.getElementById('groupForm').addEventListener('submit',ev=>{ev.preventDefault();let a=document.getElementById('groupName').value.trim(),b=document.getElementById('nickname').value.trim();if(!a||!b){document.getElementById('error').textContent='両方の名前を入力してください。';return}save={version:1,groupName:a,nickname:b,profilePhotoTaken:false,createdAt:new Date().toISOString()};if(!persist()){document.getElementById('error').textContent='保存できませんでした。ブラウザの保存設定を確認してください。';return}stage='main';currentTab='home';render()})}
const tabs=[['home','⌂','ホーム'],['members','♧','メンバー'],['lessons','✧','レッスン'],['calendar','▦','カレンダー'],['activity','♫','活動'],['office','▤','事務所']];
function main(){if(!save){stage='title';return render()}const tab=tabs.find(t=>t[0]===currentTab)||tabs[0];root.innerHTML=`<div class="home"><header class="topbar"><strong>${esc(save.groupName)}</strong><span>ゲーム開始時刻 06:00（仮表示）</span></header><main class="content" id="page"><h1>${esc(tab[2])}</h1>${page()}</main><nav class="bottom" aria-label="メインタブ">${tabs.map(t=>`<button type="button" class="tab ${t[0]===currentTab?'active':''}" data-tab="${t[0]}" ${t[0]===currentTab?'aria-current="page"':''}><span class="sym">${t[1]}</span>${t[2]}</button>`).join('')}</nav></div>`;document.querySelectorAll('[data-tab]').forEach(x=>x.addEventListener('click',()=>{currentTab=x.dataset.tab;homePanel='';render()}));document.querySelectorAll('[data-panel]').forEach(x=>x.addEventListener('click',()=>{homePanel=x.dataset.panel;render()}));bind('backHome',()=>{homePanel='';render()});bind('reset',()=>{if(confirm('セーブデータを削除してタイトルに戻りますか？')){localStorage.removeItem(KEY);save=null;stage='title';render()}})}
function page(){if(currentTab==='home')return homePanel?`<button id="backHome" class="back">← ホームに戻る</button><div class="placeholder"><b>${esc(homePanel)}</b><p>この機能は次の実装段階で追加します。</p></div>`:`<p class="small">${esc(save.nickname)} の物語が始まります。</p><div class="tiles">${[['✉','メール'],['☏','LINE'],['𝕏','X'],['▦','本日のスケジュール'],['◎','目標']].map((x,i)=>`<button class="tile ${i===4?'wide':''}" data-panel="${x[1]}"><span>${x[0]}</span>${x[1]}</button>`).join('')}</div><div class="goal"><div class="eyebrow">FIRST MISSION</div><h2>公式プロフィール写真を撮影する</h2><p class="note">現在は応募時の私服写真を使用しています。撮影機能と写真の切り替えは次の実装段階で追加します。</p></div><div class="danger">開発用：${button('セーブデータを削除','reset','btn ghost')}</div>`;
if(currentTab==='members')return `<p class="small">所属メンバー：12人（仮データ）</p><div class="listing">${Array.from({length:count},(_,i)=>`<div class="member"><span>メンバー ${String(i+1).padStart(2,'0')}</span><span class="small">応募時写真／情報未設定</span></div>`).join('')}</div>`;
return `<div class="placeholder"><b>${esc(tabs.find(t=>t[0]===currentTab)[2])}</b><p>タブの枠を用意しました。内容は今後の実装で追加します。</p></div>`}
save=load();render();
})();
</script>
</body></html>
